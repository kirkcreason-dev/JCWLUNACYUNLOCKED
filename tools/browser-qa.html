<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Lunacy browser QA</title><style>body{margin:0;background:#343039;color:white;font:14px Arial}header{display:flex;gap:10px;align-items:center;padding:12px;flex-wrap:wrap}button{padding:10px;border:1px solid #aaa;background:#151219;color:white;cursor:pointer}main{padding:0 12px 12px;display:flex;gap:12px;align-items:flex-start}iframe{display:block;flex:none;border:1px solid #716477;background:black}output{color:#b0ff20}#scenario-status{min-width:220px}</style></head><body><header><b>VIEWPORT CHECK</b><button data-size="1280,800">Desktop 1280 × 800</button><button data-size="390,844">Portrait 390 × 844</button><button data-size="320,568">Small phone 320 × 568</button><button data-size="844,390">Landscape 844 × 390</button><output id="size">390 × 844</output></header><header><button id="add-player">Second player 390 × 844</button><label>Input target <select id="qa-player"><option value="game-frame">Host</option><option value="guest-frame">Guest</option></select></label><span>Timed keyboard input through game listeners:</span><button data-key="ArrowRight">Walk right 2 seconds</button><button data-key="ArrowLeft">Walk left 2 seconds</button><button data-key="ArrowUp">Jump</button><button data-key="KeyZ">Strike</button><button data-key="KeyX">Heavy</button><button data-key="KeyC">Grapple</button><button data-key="KeyV">Finisher</button><button id="approach-both">Approach both 10 seconds</button><output id="scenario-status">Ready</output></header><main><iframe id="game-frame" title="Game under test" allowfullscreen src="/" width="390" height="844"></iframe></main><script>
const frame=document.getElementById('game-frame');
for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{const [w,h]=b.dataset.size.split(',');frame.width=w;frame.height=h;document.getElementById('size').textContent=`${w} × ${h}`;};
document.getElementById('add-player').onclick=()=>{if(document.getElementById('guest-frame'))return;const guest=document.createElement('iframe');guest.id='guest-frame';guest.title='Second player';guest.src='/';guest.width=390;guest.height=844;document.querySelector('main').append(guest);};
let running=false;
document.getElementById('approach-both').onclick=()=>{if(running||!document.getElementById('guest-frame'))return;running=true;const pairs=[[frame.contentWindow,'ArrowRight'],[document.getElementById('guest-frame').contentWindow,'ArrowLeft']];for(const [win,code] of pairs)win.dispatchEvent(new KeyboardEvent('keydown',{code,key:code,bubbles:true}));document.getElementById('scenario-status').textContent='Both players approaching';setTimeout(()=>{for(const [win,code] of pairs)win.dispatchEvent(new KeyboardEvent('keyup',{code,key:code,bubbles:true}));running=false;document.getElementById('scenario-status').textContent='Both players released';},10000);};
for(const b of document.querySelectorAll('[data-key]'))b.onclick=()=>{if(running)return;running=true;const code=b.dataset.key,key=code.startsWith('Key')?code.slice(3).toLowerCase():code,target=document.getElementById(document.getElementById('qa-player').value)||frame,win=target.contentWindow;target.focus();win.focus();if(!win.document.getElementById('pause').hidden)win.document.getElementById('resume').click();win.dispatchEvent(new KeyboardEvent('keydown',{code,key,bubbles:true}));document.getElementById('scenario-status').textContent=`Holding ${key}`;setTimeout(()=>{win.dispatchEvent(new KeyboardEvent('keyup',{code,key,bubbles:true}));document.getElementById('scenario-status').textContent=`Released ${key}`;running=false;},code==='ArrowRight'||code==='ArrowLeft'?2000:120);};
</script></body></html>
